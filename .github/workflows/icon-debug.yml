name: Icon debug (temporary)
on:
  pull_request:
    paths:
      - .github/workflows/icon-debug.yml
      - ClaudeWatch/AppIcon.icon/**
permissions:
  contents: write
jobs:
  debug:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/select-xcode
      - name: Find which icon.json keys ictool rejects
        run: |
          ICT="$(find "$(xcode-select -p)/../Applications" -name ictool -type f | head -1)"
          "$ICT" --version || true
          python3 - "$ICT" <<'PY'
          import copy, json, shutil, subprocess, sys, tempfile, os
          ictool = sys.argv[1]
          base = json.load(open("ClaudeWatch/AppIcon.icon/icon.json"))

          def render(doc, label):
              d = tempfile.mkdtemp()
              pkg = os.path.join(d, "Test.icon")
              shutil.copytree("ClaudeWatch/AppIcon.icon", pkg)
              json.dump(doc, open(os.path.join(pkg, "icon.json"), "w"), indent=2)
              out = os.path.join(d, "out.png")
              r = subprocess.run([ictool, pkg, "--export-image", "--output-file", out, "--platform", "macOS",
                                  "--rendition", "Default", "--width", "512", "--height", "512", "--scale", "1"],
                                 capture_output=True, text=True)
              ok = r.returncode == 0 and os.path.exists(out)
              print(f"{'OK  ' if ok else 'FAIL'} {label}: {(r.stdout + r.stderr).strip()[:200]}")
              return ok

          render(base, "full document")
          for key in list(base):
              doc = copy.deepcopy(base); del doc[key]; render(doc, f"without top-level {key}")
          for gi, group in enumerate(base["groups"]):
              for key in list(group):
                  if key == "layers": continue
                  doc = copy.deepcopy(base); del doc["groups"][gi][key]; render(doc, f"group {gi} without {key}")
              for key in list(group["layers"][0]):
                  if key in ("image-name", "name"): continue
                  doc = copy.deepcopy(base); del doc["groups"][gi]["layers"][0][key]; render(doc, f"group {gi} layer without {key}")
          minimal = {"groups": [{"layers": [{"image-name": "Bubble.svg", "name": "Bubble"}]}],
                     "supported-platforms": {"circles": ["watchOS"], "squares": "shared"}}
          render(minimal, "minimal")
          PY
