name: Release DMG

# Builds ClaudeWatch.app (Release, universal) into a DMG and attaches it to the release.
# Runs automatically when a release is published. It can also be started manually:
#   - tag empty:                    build a DMG as a workflow artifact only
#   - tag set:                      attach the DMG to that existing release
#   - tag set + create_release:     build from the selected branch, then create and publish
#                                   the release (new tag on that commit) with the DMG attached
# Pull requests that change packaging or artwork build the DMG as an artifact only.
on:
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/actions/select-xcode/**
      - Scripts/make-dmg.sh
      - Artwork/**
      - ClaudeWatch/AppIcon.icon/**
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the DMG to (leave empty to only build an artifact)"
        required: false
        default: ""
      create_release:
        description: "Create and publish the release for this tag from the selected branch (build must succeed first)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build DMG
    runs-on: macos-26
    timeout-minutes: 30
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      CREATE_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A release being created does not have a tag yet: build the dispatched commit.
          ref: ${{ github.event.release.tag_name || (inputs.create_release && github.sha) || inputs.tag || github.sha }}

      - name: Select Xcode 26
        uses: ./.github/actions/select-xcode

      - name: Determine version
        id: version
        run: |
          if [ -n "$TAG" ]; then
            VERSION="${TAG#v}"
          else
            VERSION="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          case "$VERSION" in
            ''|*[!A-Za-z0-9._-]*) echo "Unsupported tag '$TAG': use letters, digits, '.', '_' or '-' (e.g. v0.1.0)"; exit 1 ;;
          esac
          # CFBundleShortVersionString must be numeric (x.y.z); keep any suffix only in the file name.
          MARKETING_VERSION="$(printf '%s' "$VERSION" | sed -E 's/^([0-9]+(\.[0-9]+){0,2}).*/\1/')"
          case "$MARKETING_VERSION" in
            ''|*[!0-9.]*) MARKETING_VERSION="0.0.0" ;;
          esac
          {
            echo "version=$VERSION"
            echo "marketing=$MARKETING_VERSION"
            echo "build=${GITHUB_RUN_NUMBER}"
          } >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (marketing $MARKETING_VERSION, build $GITHUB_RUN_NUMBER)"

      - name: Test
        run: |
          swift test --package-path ClaudeWatchCore
          mkdir -p build
          xcodebuild test \
            -project ClaudeWatch.xcodeproj -scheme ClaudeWatch \
            -destination 'platform=macOS' -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- > build/test.log 2>&1 || { tail -80 build/test.log; exit 1; }
          grep -E "Executed .* tests" build/test.log | tail -1

      - name: Build Release app
        run: |
          xcodebuild build \
            -project ClaudeWatch.xcodeproj -scheme ClaudeWatch -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY=- \
            MARKETING_VERSION="${{ steps.version.outputs.marketing }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            > build/release.log 2>&1 || { tail -80 build/release.log; exit 1; }
          APP="build/DerivedData/Build/Products/Release/ClaudeWatch.app"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -archs "$APP/Contents/MacOS/ClaudeWatch"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
          ICON="$(/usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "$APP/Contents/Info.plist")"
          test -f "$APP/Contents/Resources/${ICON%.icns}.icns"

      - name: Create DMG
        id: dmg
        run: |
          APP="build/DerivedData/Build/Products/Release/ClaudeWatch.app"
          DMG="ClaudeWatch-${{ steps.version.outputs.version }}.dmg"
          Scripts/make-dmg.sh "$APP" "build/$DMG"
          (cd build && shasum -a 256 "$DMG" > "$DMG.sha256")
          cat "build/$DMG.sha256"
          {
            echo "path=build/$DMG"
            echo "name=$DMG"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.name }}
          path: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.dmg.outputs.path }}.sha256
          if-no-files-found: error

      - name: Create release
        if: env.TAG != '' && env.CREATE_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; not recreating it."
            exit 1
          fi
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          cat > build/release-notes.md <<'NOTES'
          ## Install

          Download the DMG below, open it and drag **ClaudeWatch** to Applications.
          This build is ad-hoc signed and not notarized, so macOS blocks the first launch:
          open it once via **System Settings › Privacy & Security › Open Anyway**, or run
          `xattr -dr com.apple.quarantine /Applications/ClaudeWatch.app`.

          Then connect Claude Code hooks as described in the
          [README](https://github.com/MagicalWig34653/ClaudeWatch#connect-claude-code).
          Requires macOS 14 or newer. Universal (Apple silicon and Intel).
          NOTES
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "ClaudeWatch $VERSION" \
            --notes-file build/release-notes.md --generate-notes $PRERELEASE

      - name: Attach DMG to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            "${{ steps.dmg.outputs.path }}" "${{ steps.dmg.outputs.path }}.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
